[project]
name = "mcsr-tracker"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chengggit" }
]
requires-python = ">=3.14"
dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "click==8.5.0",
    "fastapi==0.141.1",
    "h11==0.16.0",
    "idna==3.20",
    "packaging>=26.3",
    "prompt-toolkit==3.0.53",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "pynbt>=3.2.0",
    "questionary==2.1.1",
    "starlette==1.6.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "uvicorn==0.53.0",
    "watchdog==6.0.0",
    "wcwidth==0.8.4",
]

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pyright>=1.1.411",
    "ruff>=0.16.4",
]

[tool.poe.tasks]
lint = { shell = "ruff check . && npm run lint" }
fix = { shell = "ruff check --fix . && npm run lint-fix" }
format = { shell = "ruff format . && npm run format" }
format-check = { shell = "ruff format --check . && npm run format-check" }
typecheck = "pyright"

[tool.poe.tasks.dev]
shell = "uvicorn mcsr.app.api:app --reload --reload-dir src/mcsr/app & npm run dev-frontend"

[tool.ruff.format]
quote-style = "double"

[tool.ruff]
line-length = 104
target-version = "py314"

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "E",   # pycodestyle
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "PTH", # use pathlib
    "PIE", # flake8-pie
    "RUF", # Ruff-specific rules
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line too long; formatter handles it 
    "PTH123", # let me use open()
]
allowed-confusables = ["❯"]


[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.isort]
known-first-party = ["mcsr"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["src/mcsr"]
exclude = ["__pycache__", ".*", ".venv", "data", "**/node_modules"]
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcsr"]

[project.scripts]
mcsr = "mcsr.__main__:main"
