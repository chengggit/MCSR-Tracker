[project]
name = "mcsr-tracker"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chengggit" }
]
requires-python = ">=3.14"
dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "click==8.5.0",
    "fastapi==0.141.1",
    "h11==0.16.0",
    "idna==3.20",
    "packaging>=26.3",
    "prompt-toolkit==3.0.53",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "questionary==2.1.1",
    "starlette==1.6.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "uvicorn==0.53.0",
    "watchdog==6.0.0",
    "wcwidth==0.8.4",
]

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pyright>=1.1.411",
    "ruff>=0.16.4",
]

[tool.poe.tasks]
lint = "ruff check ."
format = { shell = "ruff check --fix . && ruff format ." }
typecheck = "pyright"

[tool.poe.tasks.dev]
shell = """
    uvicorn mcsr.app.api:app --reload --reload-dir src/mcsr/app &
    npx browser-sync start --proxy localhost:8000 --files "src/mcsr/static/**/*" --port 5500 --no-notify
"""

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   
    "F", 
    "I",
    "W",
    "UP",
]
ignore = ["E501"]  # line too long

[tool.ruff.lint.isort]
known-first-party = ["mcsr"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["src/mcsr"]
exclude = ["__pycache__", ".*", ".venv", "data", "**/node_modules"]
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcsr"]

[project.scripts]
mcsr = "mcsr.__main__:main"
